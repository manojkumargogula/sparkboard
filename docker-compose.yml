# docker compose up --build   →   http://localhost:8080
name: sparkboard

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sparkboard
      POSTGRES_PASSWORD: sparkboard
      POSTGRES_DB: sparkboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: pg_isready -U sparkboard
      interval: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: sparkboard-api:local
    # Run database migrations, then start the API.
    command: sh -c "alembic upgrade head && uvicorn sparkboard_api.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://sparkboard:sparkboard@db:5432/sparkboard
      ENVIRONMENT: local
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-locally}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"
      interval: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: sparkboard-web:local
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:

# ${API_UPSTREAM} is filled in from the environment when the container starts.
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Allows Google sign-in (script, iframe, profile photos); nothing else leaves the site.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  location = /nginx-health { return 200 "ok"; }

  location /api/ {
    # Public reverse proxy to a fixed upstream, so `internal` does not apply.
    # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Built assets have hashed names, so cache them forever; never cache the page itself.
  # (`expires` instead of add_header, so the security headers above still apply.)
  location /assets/ {
    expires max;
  }

  location / {
    expires -1;
    try_files $uri /index.html;
  }
}

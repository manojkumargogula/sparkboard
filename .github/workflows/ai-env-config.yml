name: AI environment config

# Edit infra/terraform/environments/<name>.intent.yaml in plain language (goal, budget,
# availability). Claude proposes sizing, policy clamps it, and the generated
# tfvars + Helm values arrive as a PR for human review.

on:
  push:
    branches: [main]
    paths: ["infra/terraform/environments/*.intent.yaml", "infra/terraform/environments/policy.yaml"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Generate configs
        id: gen
        working-directory: tools/aiops
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          {
            echo "body<<EOF_BODY"
            for intent in ../../infra/terraform/environments/*.intent.yaml; do
              uv run --frozen aiops envgen --intent "$intent" --policy ../../infra/terraform/environments/policy.yaml \
                --out-dir ../../infra/terraform/environments/generated
              echo; echo "---"; echo
            done
            echo "EOF_BODY"
          } >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: ai/env-config
          title: "AI: regenerate environment configs"
          commit-message: "chore(env): regenerate environment configs from intents"
          body: |
            Generated by `aiops envgen` from `infra/terraform/environments/*.intent.yaml`, clamped by `infra/terraform/environments/policy.yaml`.

            ${{ steps.gen.outputs.body }}
          labels: ai-generated, infrastructure

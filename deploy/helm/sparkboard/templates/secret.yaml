{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sb.secretName" . }}
  labels: {{- include "sb.labels" . | nindent 4 }}
  annotations:
    # Must exist before the migration hook runs.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required when secrets.existingSecret is empty" .Values.secrets.databaseUrl | quote }}
  ADMIN_TOKEN: {{ .Values.secrets.adminToken | quote }}
  AI_API_KEY: {{ .Values.secrets.aiApiKey | quote }}
{{- end }}

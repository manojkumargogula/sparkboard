{{- range $component := list "api" "web" }}
{{- $cfg := index $.Values $component }}
{{- if $cfg.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "sb.name" $ }}-{{ $component }}
  labels: {{- include "sb.labels" $ | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "sb.name" $ }}-{{ $component }} }
  minReplicas: {{ $cfg.autoscaling.minReplicas }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ $cfg.autoscaling.targetCPU }} } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sb.name" $ }}-{{ $component }}
  labels: {{- include "sb.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "sb.selector" (dict "root" $ "component" $component) | nindent 6 }}
{{- end }}

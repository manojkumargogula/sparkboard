name: Deploy · Vercel

# Runs after CI passes on main (or by hand). Zero-downtime production flow:
#   migrate → deploy WITHOUT moving the domain → probe the new deployment →
#   health gate (SLOs + Claude) → promote, or keep traffic on the old release
#   and open an incident issue.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [preview, production]
        default: preview
      rollback:
        description: Roll production back to the previous release
        type: boolean
        default: false
  workflow_call: # from ChatOps (ai.yml): /deploy preview, /rollback production, ...
    inputs:
      environment: { type: string, required: true }
      ref: { type: string, required: false, default: "" }
      rollback: { type: boolean, required: false, default: false }
      pr: { type: string, required: false, default: "" }
    secrets:
      VERCEL_TOKEN: { required: false }
      VERCEL_ORG_ID: { required: false }
      VERCEL_PROJECT_ID: { required: false }
      DATABASE_URL_UNPOOLED: { required: false }
      PREVIEW_DATABASE_URL_UNPOOLED: { required: false }
      ANTHROPIC_API_KEY: { required: false }
      NVIDIA_API_KEY: { required: false }
      VERCEL_AUTOMATION_BYPASS_SECRET: { required: false }

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: vercel-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    # Manual and ChatOps runs always; from CI only after a successful push to main
    # (not the weekly scheduled scan).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: ${{ (inputs.environment == 'production' || !inputs.environment) && 'production' || 'preview' }}
      url: ${{ steps.result.outputs.url }}
    env:
      ENVIRONMENT: ${{ inputs.environment == 'production' && 'production' || inputs.environment && 'preview' || 'production' }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      SHA: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.SHA }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install tooling
        run: |
          npm i -g vercel@latest >/dev/null
          (cd tools/aiops && uv sync --frozen -q)

      - name: Baseline from the live release
        continue-on-error: true
        working-directory: tools/aiops
        run: uv run aiops smoke --url "$PUBLIC_URL" --rounds 3 --out ../../baseline.json

      - name: Roll back production
        if: inputs.rollback
        id: rollback
        run: |
          vercel rollback --yes --token "$VERCEL_TOKEN"
          echo "url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"

      - name: Build
        if: ${{ !inputs.rollback }}
        run: |
          if [ "$ENVIRONMENT" = production ]; then
            vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
            vercel build --prod --token "$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"
            vercel build --token "$VERCEL_TOKEN"
          fi

      # Migrations run before traffic shifts, so they must be backward compatible
      # (expand → deploy → contract). The previous release keeps working on the new schema.
      - name: Migrate database
        if: ${{ !inputs.rollback }}
        working-directory: app/backend
        env:
          DATABASE_URL: ${{ (inputs.environment || 'production') == 'production' && secrets.DATABASE_URL_UNPOOLED || secrets.PREVIEW_DATABASE_URL_UNPOOLED }}
        run: uv run --frozen alembic upgrade head

      - name: Deploy (without moving the domain)
        if: ${{ !inputs.rollback }}
        id: deploy
        run: |
          if [ "$ENVIRONMENT" = production ]; then
            url=$(vercel deploy --prebuilt --prod --skip-domain --token "$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --token "$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Probe the new deployment
        working-directory: tools/aiops
        env:
          URL: ${{ steps.deploy.outputs.url || steps.rollback.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          sleep 5
          uv run aiops smoke --url "$URL" --rounds 6 --out ../../current.json \
            ${BYPASS:+--header "x-vercel-protection-bypass: $BYPASS"}

      - name: Collect runtime logs
        continue-on-error: true
        env:
          URL: ${{ steps.deploy.outputs.url || steps.rollback.outputs.url }}
        run: timeout 25 vercel logs "$URL" --token "$VERCEL_TOKEN" > runtime.log 2>&1 || true

      - name: Health gate (SLOs + Claude)
        id: gate
        working-directory: tools/aiops
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          uv run aiops health --current ../../current.json --baseline ../../baseline.json \
            --logs ../../runtime.log --max-error-rate 0.01 --max-p95-ms 2500

      - name: Promote
        if: steps.gate.outputs.decision == 'promote' && env.ENVIRONMENT == 'production' && !inputs.rollback
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: vercel promote "$URL" --yes --token "$VERCEL_TOKEN"

      - name: Result
        id: result
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ "$ENVIRONMENT" = production ]; then echo "url=$PUBLIC_URL" >> "$GITHUB_OUTPUT";
          else echo "url=$URL" >> "$GITHUB_OUTPUT"; fi

      - name: Report on the PR
        if: always() && inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REPORT: ${{ steps.gate.outputs.report }}
          URL: ${{ steps.deploy.outputs.url || steps.rollback.outputs.url }}
        run: |
          gh pr comment "$PR" --body "$(printf '**%s** deployment: %s\n\n%s' "$ENVIRONMENT" "$URL" "$REPORT")"

      - name: Incident issue
        if: steps.gate.outputs.decision == 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.gate.outputs.report }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh issue create --title "Deploy blocked by health gate: ${ENVIRONMENT} @ ${SHA::7}" \
            --label incident --body "$(printf 'The new release (%s) failed the health gate. Traffic stayed on the previous release.\n\n%s\n\nRun: %s/%s/actions/runs/%s' "$URL" "$REPORT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")" \
            || gh issue create --title "Deploy blocked by health gate: ${ENVIRONMENT}" --body "$REPORT"
          exit 1

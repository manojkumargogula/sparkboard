name: Deploy · Kubernetes

# One workflow for every cloud. The only cloud-specific parts are the login
# step and the Terraform stack; build, apply, probe, health gate and rollback
# are shared. One environment (production) on every cloud. Run it from the
# Actions tab or with a PR comment such as `/deploy on gcp` (see ai.yml).

on:
  workflow_dispatch:
    inputs:
      cloud:
        type: choice
        options: [k8s-aws, k8s-gcp, k8s-azure]
      rollback:
        type: boolean
        default: false
  workflow_call:
    inputs:
      cloud: { type: string, required: true }
      ref: { type: string, required: false, default: "" }
      rollback: { type: boolean, required: false, default: false }
    secrets:
      ANTHROPIC_API_KEY: { required: false }
      NVIDIA_API_KEY: { required: false }

permissions:
  contents: read
  id-token: write # OIDC federation to AWS/GCP/Azure: no long-lived cloud keys
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # GitHub environment: required reviewers approve every cloud deploy
    concurrency: k8s-${{ inputs.cloud }}
    env:
      CLOUD: ${{ inputs.cloud }}
      ROOT: infra/terraform/stacks/${{ inputs.cloud == 'k8s-aws' && 'aws' || inputs.cloud == 'k8s-gcp' && 'gcp' || 'azure' }}
      TAG: ${{ inputs.ref || github.sha }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TF_BACKEND_CONFIG: ${{ vars.TF_BACKEND_CONFIG }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$CLOUD" =~ ^k8s-(aws|gcp|azure)$ ]] || { echo "::error::unknown cloud $CLOUD"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.TAG }}" }
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_wrapper: false }
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      # ---- cloud login: the only per-cloud branch -----------------------------
      - if: inputs.cloud == 'k8s-aws'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with: { role-to-assume: "${{ vars.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - if: inputs.cloud == 'k8s-gcp'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - if: inputs.cloud == 'k8s-gcp'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with: { install_components: gke-gcloud-auth-plugin }
      - if: inputs.cloud == 'k8s-azure'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init (remote state)
        working-directory: ${{ env.ROOT }}
        run: terraform init -input=false -backend-config="$TF_BACKEND_CONFIG"

      - name: Kubeconfig + registry from the platform contract
        id: platform
        working-directory: ${{ env.ROOT }}
        run: |
          cluster=$(terraform output -raw cluster_name)
          registry=$(terraform output -raw registry_url)
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          case "$CLOUD" in
            k8s-aws)   aws eks update-kubeconfig --name "$cluster"
                       aws ecr get-login-password | docker login --username AWS --password-stdin "${registry%%/*}" ;;
            k8s-gcp)   gcloud container clusters get-credentials "$cluster" --region "$GCP_REGION"
                       gcloud auth configure-docker "${registry%%/*}" --quiet ;;
            k8s-azure) az aks get-credentials -g "$cluster" -n "$cluster" --overwrite-existing
                       az acr login --name "${registry%%.*}" ;;
          esac

      - name: Rollback
        if: inputs.rollback
        run: helm rollback sparkboard -n sparkboard --wait

      - name: Build and push images
        if: ${{ !inputs.rollback }}
        env:
          REGISTRY: ${{ steps.platform.outputs.registry }}
        run: |
          for image in api web; do
            docker build -t "$REGISTRY/sparkboard-$image:$TAG" -f "infra/docker/$image.Dockerfile" .
            docker push "$REGISTRY/sparkboard-$image:$TAG"
          done

      # The Helm release is atomic: a failed rollout rolls itself back.
      - name: Terraform apply
        if: ${{ !inputs.rollback }}
        working-directory: ${{ env.ROOT }}
        env:
          TF_VAR_image_tag: ${{ env.TAG }}
          TF_VAR_ai_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
        # environments/generated/production.tfvars comes from AI sizing (aiops envgen), reviewed in a PR.
        run: terraform apply -input=false -auto-approve -var-file=../../environments/generated/production.tfvars

      - name: Probe
        working-directory: tools/aiops
        run: |
          host=$(kubectl -n sparkboard get ingress sparkboard -o jsonpath='{.status.loadBalancer.ingress[0].hostname}{.status.loadBalancer.ingress[0].ip}')
          echo "Public URL: http://$host" >> "$GITHUB_STEP_SUMMARY"
          uv run --frozen aiops smoke --url "http://$host" --rounds 6 --out ../../current.json
          kubectl -n sparkboard logs -l app.kubernetes.io/component=api --since=10m --tail=2000 > ../../runtime.log || true

      - name: Health gate (SLOs + Claude)
        id: gate
        working-directory: tools/aiops
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: uv run --frozen aiops health --current ../../current.json --logs ../../runtime.log

      - name: Automatic rollback
        if: steps.gate.outputs.decision == 'rollback' && !inputs.rollback
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.gate.outputs.report }}
        run: |
          helm rollback sparkboard -n sparkboard --wait
          gh issue create --title "Auto-rollback on $CLOUD @ ${TAG::7}" --body "$REPORT"
          exit 1

name: Deploy · Vercel

# Production flow (zero-downtime, self-healing):
#   migrate → deploy WITHOUT moving the domain → probe the new deployment →
#   AI + SLO health gate → promote (domain moves) or leave traffic on the old
#   release and open an incident issue with Claude's summary.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "infra/**", "environments/**"]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [preview, staging, production]
        default: preview
      rollback:
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      ref: { type: string, required: false, default: "" }
      rollback: { type: boolean, required: false, default: false }
      pr: { type: string, required: false, default: "" }

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
  deployments: write

concurrency:
  group: vercel-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  ENVIRONMENT: ${{ inputs.environment || 'production' }}
  PUBLIC_URL: ${{ vars.PUBLIC_URL }}

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [ci]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ (inputs.environment || 'production') == 'production' && 'production' || 'preview' }}
      url: ${{ steps.result.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v6
      - name: Install tooling
        run: |
          npm i -g vercel@latest >/dev/null
          (cd tools/aiops && uv sync --frozen -q)

      - name: Baseline from the live release
        continue-on-error: true
        working-directory: tools/aiops
        run: uv run aiops smoke --url "$PUBLIC_URL" --rounds 3 --out ../../baseline.json

      - name: Roll back production
        if: inputs.rollback
        id: rollback
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
        run: |
          vercel rollback --yes --token "$VERCEL_TOKEN"
          echo "url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"

      - name: Build
        if: ${{ !inputs.rollback }}
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
        run: |
          if [ "$ENVIRONMENT" = production ]; then
            vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
            vercel build --prod --token "$VERCEL_TOKEN"
          else
            vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"
            vercel build --token "$VERCEL_TOKEN"
          fi

      # Migrations run before traffic shifts, so they must be backward compatible
      # (expand → deploy → contract). The previous release keeps working on the new schema.
      - name: Migrate database
        if: ${{ !inputs.rollback }}
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ (inputs.environment || 'production') == 'production' && secrets.DATABASE_URL_UNPOOLED || secrets.PREVIEW_DATABASE_URL_UNPOOLED }}
        run: uv run --frozen alembic upgrade head

      - name: Deploy (without moving the domain)
        if: ${{ !inputs.rollback }}
        id: deploy
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
        run: |
          if [ "$ENVIRONMENT" = production ]; then
            url=$(vercel deploy --prebuilt --prod --skip-domain --token "$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --token "$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Probe the new deployment
        working-directory: tools/aiops
        env:
          URL: ${{ steps.deploy.outputs.url || steps.rollback.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          sleep 5
          uv run aiops smoke --url "$URL" --rounds 6 --out ../../current.json \
            ${BYPASS:+--header "x-vercel-protection-bypass: $BYPASS"}

      - name: Collect runtime logs
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.deploy.outputs.url || steps.rollback.outputs.url }}
        run: timeout 25 vercel logs "$URL" --token "$VERCEL_TOKEN" > runtime.log 2>&1 || true

      - name: Health gate (SLOs + Claude)
        id: gate
        working-directory: tools/aiops
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          uv run aiops health --current ../../current.json --baseline ../../baseline.json \
            --logs ../../runtime.log --max-error-rate 0.01 --max-p95-ms 2500

      - name: Promote
        if: steps.gate.outputs.decision == 'promote' && env.ENVIRONMENT == 'production' && !inputs.rollback
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
        run: vercel promote "${{ steps.deploy.outputs.url }}" --yes --token "$VERCEL_TOKEN"

      - name: Alias staging
        if: steps.gate.outputs.decision == 'promote' && env.ENVIRONMENT == 'staging' && vars.STAGING_DOMAIN != ''
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
        run: vercel alias set "${{ steps.deploy.outputs.url }}" "${{ vars.STAGING_DOMAIN }}" --token "$VERCEL_TOKEN"

      - name: Result
        id: result
        run: |
          if [ "$ENVIRONMENT" = production ]; then echo "url=$PUBLIC_URL" >> "$GITHUB_OUTPUT";
          else echo "url=${{ steps.deploy.outputs.url }}" >> "$GITHUB_OUTPUT"; fi

      - name: Report on the PR
        if: always() && inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.gate.outputs.report }}
          URL: ${{ steps.deploy.outputs.url || steps.rollback.outputs.url }}
        run: |
          gh pr comment "${{ inputs.pr }}" --body "$(printf '**%s** deployment: %s\n\n%s' "$ENVIRONMENT" "$URL" "$REPORT")"

      - name: Incident issue
        if: steps.gate.outputs.decision == 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.gate.outputs.report }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh issue create --title "Deploy blocked by health gate: ${ENVIRONMENT} @ ${GITHUB_SHA::7}" \
            --label incident --body "$(printf 'The new release (%s) failed the health gate. Traffic stayed on the previous release.\n\n%s\n\nRun: %s/%s/actions/runs/%s' "$URL" "$REPORT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")" \
            || gh issue create --title "Deploy blocked by health gate: ${ENVIRONMENT}" --body "$REPORT"
          exit 1

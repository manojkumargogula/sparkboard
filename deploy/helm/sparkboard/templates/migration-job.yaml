{{- if .Values.migrations.enabled }}
# Runs before every install/upgrade. If it fails, the release fails and the
# previous pods keep serving: schema changes never race the new code.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sb.name" . }}-migrate
  labels: {{- include "sb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {{- include "sb.selector" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      # Hooks run before the release's ServiceAccount exists; the job needs no API access.
      automountServiceAccountToken: false
      securityContext: { runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      containers:
        - name: migrate
          image: {{ include "sb.image" (dict "root" . "component" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env: {{- include "sb.apiEnv" . | nindent 12 }}
          {{- include "sb.containerSecurity" . | nindent 10 }}
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
{{- end }}

name: Deploy · Cloud

# Deploy to AWS, GCP or Azure in either mode:
#   k8s-<cloud>  managed Kubernetes + managed Postgres, app installed with Helm
#   vm-<cloud>   one VM, app run with docker compose (Postgres in a container) behind nginx
# The cloud login is the only per-cloud step; Terraform, build, probe, the AI health
# gate and rollback are shared. Run it from the Actions tab or with a PR comment such
# as `/deploy on gcp` or `/deploy on aws vm` (see ai.yml).

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [k8s-aws, k8s-gcp, k8s-azure, vm-aws, vm-gcp, vm-azure]
      rollback:
        type: boolean
        default: false
  workflow_call:
    inputs:
      target: { type: string, required: true }
      ref: { type: string, required: false, default: "" }
      rollback: { type: boolean, required: false, default: false }
    secrets:
      ANTHROPIC_API_KEY: { required: false }
      NVIDIA_API_KEY: { required: false }
      VM_SSH_PRIVATE_KEY: { required: false }
      ADMIN_TOKEN: { required: false }

permissions:
  contents: read
  id-token: write # OIDC federation to AWS/GCP/Azure: no long-lived cloud keys
  packages: write # vm mode pushes images to GHCR
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # required reviewers approve every cloud deploy
    concurrency: deploy-${{ inputs.target }}
    env:
      TARGET: ${{ inputs.target }}
      MODE: ${{ startsWith(inputs.target, 'vm-') && 'vm' || 'k8s' }}
      CLOUD: ${{ endsWith(inputs.target, '-aws') && 'aws' || endsWith(inputs.target, '-gcp') && 'gcp' || 'azure' }}
      ROOT: infra/terraform/stacks/${{ endsWith(inputs.target, '-aws') && 'aws' || endsWith(inputs.target, '-gcp') && 'gcp' || 'azure' }}
      TAG: ${{ inputs.ref || github.sha }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TF_BACKEND_CONFIG: ${{ vars.TF_BACKEND_CONFIG }}
      TF_VAR_deployment_mode: ${{ startsWith(inputs.target, 'vm-') && 'vm' || 'k8s' }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$TARGET" =~ ^(k8s|vm)-(aws|gcp|azure)$ ]] || { echo "::error::unknown target $TARGET"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "${{ env.TAG }}" }
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_wrapper: false }
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: env.MODE == 'k8s'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      # ---- cloud login: the only per-cloud branch --------------------------------
      - if: env.CLOUD == 'aws'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with: { role-to-assume: "${{ vars.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - if: env.CLOUD == 'gcp'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - if: env.CLOUD == 'gcp'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with: { install_components: gke-gcloud-auth-plugin }
      - if: env.CLOUD == 'azure'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init (remote state)
        working-directory: ${{ env.ROOT }}
        run: terraform init -input=false -backend-config="$TF_BACKEND_CONFIG"

      # ======================= k8s: Helm on managed Kubernetes =======================

      - name: "k8s: kubeconfig + registry from the platform contract"
        if: env.MODE == 'k8s'
        id: platform
        working-directory: ${{ env.ROOT }}
        run: |
          cluster=$(terraform output -raw cluster_name)
          registry=$(terraform output -raw registry_url)
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          case "$CLOUD" in
            aws)   aws eks update-kubeconfig --name "$cluster"
                   aws ecr get-login-password | docker login --username AWS --password-stdin "${registry%%/*}" ;;
            gcp)   gcloud container clusters get-credentials "$cluster" --region "$GCP_REGION"
                   gcloud auth configure-docker "${registry%%/*}" --quiet ;;
            azure) az aks get-credentials -g "$cluster" -n "$cluster" --overwrite-existing
                   az acr login --name "${registry%%.*}" ;;
          esac

      - name: "k8s: rollback"
        if: env.MODE == 'k8s' && inputs.rollback
        run: helm rollback sparkboard -n sparkboard --wait

      - name: "k8s: build and push images"
        if: env.MODE == 'k8s' && !inputs.rollback
        env:
          REGISTRY: ${{ steps.platform.outputs.registry }}
        run: |
          for image in api web; do
            docker build -t "$REGISTRY/sparkboard-$image:$TAG" -f "infra/docker/$image.Dockerfile" .
            docker push "$REGISTRY/sparkboard-$image:$TAG"
          done

      # The Helm release is atomic: a failed rollout rolls itself back.
      - name: "k8s: terraform apply"
        if: env.MODE == 'k8s' && !inputs.rollback
        working-directory: ${{ env.ROOT }}
        env:
          TF_VAR_image_tag: ${{ env.TAG }}
          TF_VAR_ai_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_api_allowed_cidrs: ${{ vars.K8S_API_ALLOWED_CIDRS }}
        # environments/generated/production.tfvars comes from AI sizing (aiops envgen), reviewed in a PR.
        run: terraform apply -input=false -auto-approve -var-file=../../environments/generated/production.tfvars

      - name: "k8s: public URL and logs"
        if: env.MODE == 'k8s'
        id: k8s
        run: |
          host=$(kubectl -n sparkboard get ingress sparkboard -o jsonpath='{.status.loadBalancer.ingress[0].hostname}{.status.loadBalancer.ingress[0].ip}')
          echo "url=http://$host" >> "$GITHUB_OUTPUT"
          kubectl -n sparkboard logs -l app.kubernetes.io/component=api --since=10m --tail=2000 > runtime.log || true

      # ============== vm: docker compose + nginx on one VM, over SSH ==============

      - name: "vm: terraform apply (network, firewall, VM)"
        if: env.MODE == 'vm'
        working-directory: ${{ env.ROOT }}
        env:
          TF_VAR_image_tag: ${{ env.TAG }}
          TF_VAR_ssh_public_key: ${{ vars.VM_SSH_PUBLIC_KEY }}
          TF_VAR_ssh_allowed_cidrs: ${{ vars.VM_SSH_ALLOWED_CIDRS }}
        run: terraform apply -input=false -auto-approve -var-file=../../environments/generated/production.tfvars

      - name: "vm: connection details"
        if: env.MODE == 'vm'
        id: vm
        working-directory: ${{ env.ROOT }}
        env:
          SSH_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_DOMAIN: ${{ vars.VM_DOMAIN }}
        run: |
          ip=$(terraform output -raw vm_public_ip)
          user=$(terraform output -raw vm_ssh_user)
          domain=${VM_DOMAIN:-$ip.sslip.io} # sslip.io resolves to the IP: HTTPS without your own DNS
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          for _ in $(seq 1 30); do
            ssh-keyscan -T 5 "$ip" > ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ] && break
            sleep 10
          done
          {
            echo "ip=$ip"
            echo "domain=$domain"
            echo "dest=$user@$ip"
          } >> "$GITHUB_OUTPUT"
          # First boot: wait until cloud-init has installed Docker.
          ssh -i ~/.ssh/id_deploy "$user@$ip" 'cloud-init status --wait >/dev/null; docker --version'

      - name: "vm: build and push images to GHCR"
        if: env.MODE == 'vm' && !inputs.rollback
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          registry="ghcr.io/${OWNER,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          for image in api web; do
            docker build -t "$registry/sparkboard-$image:$TAG" -f "infra/docker/$image.Dockerfile" .
            docker push "$registry/sparkboard-$image:$TAG"
          done

      - name: "vm: ship files and deploy (auto-rollback inside deploy.sh)"
        if: env.MODE == 'vm'
        env:
          DEST: ${{ steps.vm.outputs.dest }}
          DOMAIN: ${{ steps.vm.outputs.domain }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          AUTH_REQUIRED: ${{ vars.AUTH_REQUIRED || 'false' }}
          CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          ssh_vm() { ssh -i ~/.ssh/id_deploy "$DEST" "$@"; }
          scp -i ~/.ssh/id_deploy infra/vm/docker-compose.yml infra/vm/nginx.conf infra/vm/deploy.sh "$DEST:/tmp/"
          # .env: settings from GitHub; the database password is created once on the VM and kept.
          {
            echo "REGISTRY=ghcr.io/${OWNER,,}"
            echo "DOMAIN=$DOMAIN"
            echo "ADMIN_TOKEN=$ADMIN_TOKEN"
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "AUTH_REQUIRED=$AUTH_REQUIRED"
            echo "CERTBOT_EMAIL=$CERTBOT_EMAIL"
          } | ssh_vm 'umask 077; cat > /tmp/settings.env'
          ssh_vm 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/sparkboard
          install -m 644 /tmp/docker-compose.yml /tmp/nginx.conf . && install -m 755 /tmp/deploy.sh .
          password=$(grep -s '^POSTGRES_PASSWORD=' .env | cut -d= -f2- || true)
          [ -n "$password" ] || password=$(openssl rand -hex 24)
          { cat /tmp/settings.env; echo "POSTGRES_PASSWORD=$password"; } > .env.new
          install -m 600 .env.new .env && rm -f .env.new /tmp/settings.env
          REMOTE
          if [ "$ROLLBACK" = "true" ]; then
            ssh_vm 'sudo /opt/sparkboard/deploy.sh --rollback'
          else
            echo "$GH_TOKEN" | ssh_vm "sudo docker login ghcr.io -u '$ACTOR' --password-stdin"
            status=0
            ssh_vm "sudo /opt/sparkboard/deploy.sh '$TAG'" || status=$?
            ssh_vm 'sudo docker logout ghcr.io' || true
            exit $status
          fi

      - name: "vm: public URL and logs"
        if: env.MODE == 'vm'
        id: vmurl
        env:
          DEST: ${{ steps.vm.outputs.dest }}
          DOMAIN: ${{ steps.vm.outputs.domain }}
        run: |
          if curl -fsS --max-time 10 "https://$DOMAIN/api/readyz" >/dev/null; then url="https://$DOMAIN"; else url="http://$DOMAIN"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          ssh -i ~/.ssh/id_deploy "$DEST" 'cd /opt/sparkboard && sudo TAG=$(cat .tag) docker compose logs api --since 10m --no-color' > runtime.log 2>&1 || true

      # ======================= shared: probe, AI health gate =======================

      - name: Probe
        working-directory: tools/aiops
        env:
          URL: ${{ steps.k8s.outputs.url || steps.vmurl.outputs.url }}
        run: |
          echo "### $TARGET: $URL" >> "$GITHUB_STEP_SUMMARY"
          uv run --frozen aiops smoke --url "$URL" --rounds 6 --out ../../current.json

      - name: Health gate (SLOs + AI)
        id: gate
        working-directory: tools/aiops
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: uv run --frozen aiops health --current ../../current.json --logs ../../runtime.log

      - name: Automatic rollback
        if: steps.gate.outputs.decision == 'rollback' && !inputs.rollback
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.gate.outputs.report }}
          DEST: ${{ steps.vm.outputs.dest }}
        run: |
          if [ "$MODE" = vm ]; then
            ssh -i ~/.ssh/id_deploy "$DEST" 'sudo /opt/sparkboard/deploy.sh --rollback'
          else
            helm rollback sparkboard -n sparkboard --wait
          fi
          gh issue create --title "Auto-rollback on $TARGET @ ${TAG::7}" --body "$REPORT"
          exit 1

# Host nginx on a Sparkboard VM: the public entry point. Proxies to the web
# container on 127.0.0.1:8080 (which serves the SPA and proxies /api).
# deploy.sh fills in __DOMAIN__; certbot then adds the HTTPS server and redirect.

server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;
  server_tokens off;
  client_max_body_size 1m;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}

name: CI

# Static analysis, code scanning and tests. Every job must pass before a merge,
# and deploy-vercel.yml only ships commits on main that passed this workflow.
# Semgrep and Trivy findings also appear under Security → Code scanning.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly: catch new CVEs in code that hasn't changed

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.26"
  NODE_VERSION: "22"
  TF_VERSION: "1.16.1"

jobs:
  branch-name:
    name: Branch name (docs/code-quality.md)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check <type>/<short-description>
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|hotfix|refactor|perf|test|docs|ci|infra|deps|chore)/[a-z0-9][a-z0-9-]{0,49}$'
          if [[ "$BRANCH" =~ $pattern || "$BRANCH" == dependabot/* ]]; then
            echo "ok: $BRANCH"
          else
            echo "::error::Branch '$BRANCH' should look like feat/short-description (see docs/code-quality.md)"
            exit 1
          fi

  # ---------------------------------------------------------------- code scanning

  sast:
    name: Code scanning · Semgrep
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep (Python, TypeScript, React, Dockerfiles, Terraform, workflows)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.140.0 semgrep scan \
            --config p/default --config p/python --config p/typescript --config p/react --config p/dockerfile \
            --metrics off --error --sarif-output=semgrep.sarif
      - name: Upload to code scanning
        if: always()
        continue-on-error: true # forks can't write security events
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with: { sarif_file: semgrep.sarif, category: semgrep }

  trivy:
    name: Code scanning · Trivy (dependencies, IaC, secrets)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Report every severity to the Security tab (never fails the job)...
      - name: Trivy filesystem scan → code scanning report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          ignore-unfixed: true
          trivyignores: infra/.trivyignore
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      # ...but only HIGH/CRITICAL block a merge.
      - name: Trivy gate (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: infra/.trivyignore
          format: table
          exit-code: "1"
          skip-setup-trivy: true
      - name: Upload to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with: { sarif_file: trivy.sarif, category: trivy }

  secrets:
    name: Code scanning · gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Code scanning · container images
    runs-on: ubuntu-latest
    strategy:
      matrix: { image: [api, web] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t sparkboard-${{ matrix.image }}:ci -f infra/docker/${{ matrix.image }}.Dockerfile .
      - name: Trivy image scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sparkboard-${{ matrix.image }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ------------------------------------------------- static analysis + tests

  api:
    name: API · lint, types, security, tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/backend } }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: sparkboard, POSTGRES_PASSWORD: sparkboard, POSTGRES_DB: sparkboard_test }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U sparkboard" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check --output-format github .
      - name: Format (ruff)
        run: uv run ruff format --check .
      - name: Types (mypy --strict)
        run: uv run mypy
      - name: Security lint (bandit)
        run: uv run bandit -q -c pyproject.toml -r src
      - name: Dependency audit (pip-audit)
        run: uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt | uv run pip-audit --strict -r /dev/stdin
      - name: Tests (pytest, coverage ≥ 85%)
        run: uv run pytest

  web:
    name: Web · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/ui } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: app/ui/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Lint (eslint strict type-checked + jsx-a11y)
        run: npm run lint
      - name: Format (prettier)
        run: npm run format:check
      - name: Types (tsc)
        run: npm run typecheck
      - name: Dependency audit (npm audit)
        run: npm audit --omit=dev --audit-level=high
      - name: Tests (vitest + coverage thresholds)
        run: npm test
      - name: Build + bundle size budget
        run: npm run build && npm run size

  aiops:
    name: aiops · lint, types, tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tools/aiops } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check --output-format github . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  infra:
    name: Infra · Dockerfiles, workflows, Terraform, Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dockerfile lint (hadolint) · api
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with: { dockerfile: infra/docker/api.Dockerfile, failure-threshold: warning }
      - name: Dockerfile lint (hadolint) · web
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with: { dockerfile: infra/docker/web.Dockerfile, failure-threshold: warning }
      - name: Workflow lint (actionlint + shellcheck)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_version: "${{ env.TF_VERSION }}" }
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform
      # Providers come from GitHub release downloads, which hit 5xx often enough to fail CI.
      # Cache them across runs (saved even when the job fails, so partial progress sticks).
      - name: Restore Terraform provider cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-providers-${{ hashFiles('infra/terraform/stacks/*/.terraform.lock.hcl') }}
          restore-keys: tf-providers-
      - name: Terraform validate + test (every stack, both deployment modes)
        env:
          TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for stack in aws gcp azure vercel; do
            ok=""
            for _ in 1 2 3; do
              if terraform -chdir=infra/terraform/stacks/$stack init -backend=false -input=false > init.log 2>&1; then ok=1; break; fi
              sleep 20
            done
            if [ -z "$ok" ]; then
              cat init.log
              # A provider download outage is not a config error: warn and move on.
              if grep -q "Failed to install provider" init.log && grep -qE "50[234] |timed out|Gateway" init.log; then
                echo "::warning title=Terraform $stack skipped::provider download failed after retries (registry/GitHub outage); configuration not validated this run"
                continue
              fi
              exit 1
            fi
            terraform -chdir=infra/terraform/stacks/$stack validate
            # Both deployment modes (vm, k8s) against mocked providers: no cloud account needed.
            if [ -d "infra/terraform/stacks/$stack/tests" ]; then
              terraform -chdir=infra/terraform/stacks/$stack test
            fi
          done
      - name: Save Terraform provider cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-providers-${{ hashFiles('infra/terraform/stacks/*/.terraform.lock.hcl') }}-${{ github.run_id }}
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
      - name: Terraform lint (tflint)
        run: tflint --init && tflint --recursive --chdir=infra/terraform/modules --minimum-failure-severity=warning
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Helm lint + schema check (kubeconform) for every cloud
        run: |
          curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors -o kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tgz kubeconform
          for cloud in aws gcp azure; do
            helm lint infra/helm/sparkboard -f infra/helm/sparkboard/values/$cloud.yaml --set secrets.databaseUrl=postgresql://ci@db/ci
            helm template sb infra/helm/sparkboard -f infra/helm/sparkboard/values/$cloud.yaml \
              --set secrets.databaseUrl=postgresql://ci@db/ci | ./kubeconform -strict -summary -kubernetes-version 1.33.0
          done

  e2e:
    name: End-to-end (Playwright on docker compose)
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start the stack
        run: |
          docker compose up -d --build --wait
          docker compose exec -T api python -m sparkboard_api.seed
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: app/ui/package-lock.json }
      - name: Playwright
        working-directory: app/ui
        env: { E2E_BASE_URL: "http://localhost:8080" }
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run e2e
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: { name: e2e-report, path: "app/ui/playwright-report\ncompose.log" }

  # AI: when a check fails on a PR, Claude explains the probable cause and fix.
  explain-failure:
    name: AI · explain the failure
    needs: [sast, trivy, secrets, images, api, web, aiops, infra, e2e]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read, pull-requests: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { version: "${{ env.UV_VERSION }}" }
      - name: Collect failed job logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run view "$RUN_ID" --log-failed > failed.log || true
          tail -c 40000 failed.log > tail.log
      - name: Explain
        id: explain
        working-directory: tools/aiops
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: uv run --frozen aiops explain --log ../../tail.log --job "CI"
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v2
        with:
          header: ai-ci-explainer
          message: ${{ steps.explain.outputs.comment }}

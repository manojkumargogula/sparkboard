[project]
name = "aiops"
version = "1.0.0"
description = "AI-assisted delivery tooling for Sparkboard: deploy planner, PR risk review, env config generator, health gate."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.6",
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
]

[project.scripts]
aiops = "aiops.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.8,<1", "mypy>=1.13,<2", "types-pyyaml", "respx>=0.21,<1"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "RUF", "S", "PL", "T20"]
ignore = ["PLR0913", "PLR2004", "T201"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["aiops"]

[tool.pytest.ini_options]
addopts = "-q --cov=aiops --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

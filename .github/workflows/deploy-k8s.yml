name: Deploy · Kubernetes

# One workflow for every cloud. The only cloud-specific parts are the login
# step and the Terraform root; build, apply, probe, gate and rollback are shared.

on:
  workflow_dispatch:
    inputs:
      cloud:
        type: choice
        options: [k8s-aws, k8s-gcp, k8s-azure]
      environment:
        type: choice
        options: [staging, production]
        default: staging
      rollback:
        type: boolean
        default: false
  workflow_call:
    inputs:
      cloud: { type: string, required: true }
      environment: { type: string, required: true }
      ref: { type: string, required: false, default: "" }
      rollback: { type: boolean, required: false, default: false }

permissions:
  contents: read
  id-token: write   # OIDC federation to AWS/GCP/Azure: no long-lived cloud keys
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency: k8s-${{ inputs.cloud }}-${{ inputs.environment }}
    env:
      CLOUD: ${{ inputs.cloud }}
      ROOT: infra/terraform/live/${{ inputs.cloud == 'k8s-aws' && 'aws' || inputs.cloud == 'k8s-gcp' && 'gcp' || 'azure' }}
      TAG: ${{ inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }
      - uses: azure/setup-helm@v4
      - uses: astral-sh/setup-uv@v6

      # ── cloud login (the only per-cloud branch) ─────────────────────────────
      - if: inputs.cloud == 'k8s-aws'
        uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - if: inputs.cloud == 'k8s-gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - if: inputs.cloud == 'k8s-gcp'
        uses: google-github-actions/setup-gcloud@v2
        with: { install_components: gke-gcloud-auth-plugin }
      - if: inputs.cloud == 'k8s-azure'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init (remote state)
        working-directory: ${{ env.ROOT }}
        run: terraform init -input=false -backend-config="${{ vars.TF_BACKEND_CONFIG }}"

      - name: Kubeconfig + registry from the platform contract
        id: platform
        working-directory: ${{ env.ROOT }}
        run: |
          cluster=$(terraform output -raw cluster_name)
          registry=$(terraform output -raw registry_url)
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          case "$CLOUD" in
            k8s-aws)   aws eks update-kubeconfig --name "$cluster"
                       aws ecr get-login-password | docker login --username AWS --password-stdin "${registry%%/*}" ;;
            k8s-gcp)   gcloud container clusters get-credentials "$cluster" --region "${{ vars.GCP_REGION }}"
                       gcloud auth configure-docker "${registry%%/*}" --quiet ;;
            k8s-azure) az aks get-credentials -g "$cluster" -n "$cluster" --overwrite-existing
                       az acr login --name "${registry%%.*}" ;;
          esac

      - name: Rollback
        if: inputs.rollback
        run: helm rollback sparkboard -n sparkboard --wait

      - name: Build and push images
        if: ${{ !inputs.rollback }}
        run: |
          for image in api web; do
            docker build -t "${{ steps.platform.outputs.registry }}/sparkboard-$image:$TAG" -f docker/$image.Dockerfile .
            docker push "${{ steps.platform.outputs.registry }}/sparkboard-$image:$TAG"
          done

      - name: Terraform apply (Helm release is atomic → auto-rollback on failed rollout)
        if: ${{ !inputs.rollback }}
        working-directory: ${{ env.ROOT }}
        env:
          TF_VAR_image_tag: ${{ env.TAG }}
          TF_VAR_ai_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
        # environments/generated/<env>.tfvars is written by the AI env-config workflow (and reviewed in a PR).
        run: |
          varfile="../../../../environments/generated/${{ inputs.environment }}.tfvars"
          if [ -f "$varfile" ]; then
            terraform apply -input=false -auto-approve -var-file="$varfile"
          else
            terraform apply -input=false -auto-approve
          fi

      - name: Probe
        working-directory: tools/aiops
        run: |
          host=$(kubectl -n sparkboard get ingress sparkboard -o jsonpath='{.status.loadBalancer.ingress[0].hostname}{.status.loadBalancer.ingress[0].ip}')
          uv run --frozen aiops smoke --url "http://$host" --rounds 6 --out ../../current.json
          kubectl -n sparkboard logs -l app.kubernetes.io/component=api --since=10m --tail=2000 > ../../runtime.log || true

      - name: Health gate (SLOs + Claude)
        id: gate
        working-directory: tools/aiops
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: uv run --frozen aiops health --current ../../current.json --logs ../../runtime.log

      - name: Automatic rollback
        if: steps.gate.outputs.decision == 'rollback' && !inputs.rollback
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.gate.outputs.report }}
        run: |
          helm rollback sparkboard -n sparkboard --wait
          gh issue create --title "Auto-rollback on $CLOUD/${{ inputs.environment }} @ ${TAG::7}" --body "$REPORT"
          exit 1

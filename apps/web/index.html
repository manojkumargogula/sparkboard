<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sparkboard · Ideas worth building</title>
    <meta
      name="description"
      content="Drop an idea, fan the ones you want, and watch the best sparks reach the roadmap. Sparkboard by Infrenic."
    />
    <meta name="theme-color" content="#eef0ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100e2a" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Sparkboard · Ideas worth building" />
    <meta property="og:description" content="Drop an idea. Fan the best ones. Ship what matters." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400..700&family=Martian+Mono:wght@400;600&display=swap"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem("sb-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
